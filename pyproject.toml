[project]
name = "gacaseMCP"
version = "1.2.0"
description = "MCP server for 1EdTech CASE 1.1 standards APIs (Georgia SuitCASE by default)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.26,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
